<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>教師平台｜方程移項大激鬥</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;margin:0;color:#172033}.wrap{max-width:1100px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 8px 30px #17203312;margin:16px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:18px;border-radius:14px;background:#f0f5ff}.num{font-size:28px;font-weight:800;margin-top:6px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #e8ebf0}button{border:0;border-radius:10px;padding:10px 14px;cursor:pointer;background:#146ef5;color:white}input{padding:10px;border:1px solid #ccd3df;border-radius:10px}.muted{color:#6b7280}.notice{font-size:13px;color:#8a5a00;background:#fff5d6;padding:12px;border-radius:10px}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><div class="top"><div><div class="muted">張沛松紀念中學</div><h1>教師平台</h1></div><div><button onclick="loadAll()">重新整理</button> <a href="index.html">返回學生遊戲</a></div></div><div class="notice">本頁按要求不用登入。知道網址的人均可查看統計，請不要把此頁網址當作機密。</div><div class="card"><h2>整體概覽</h2><div class="stats"><div class="stat">學生／班別<div id="students" class="num">—</div></div><div class="stat">挑戰總數<div id="games" class="num">—</div></div><div class="stat">完成次數<div id="finished" class="num">—</div></div><div class="stat">平均時間<div id="avg" class="num">—</div></div></div></div><div class="card"><div class="top"><h2>學生表現</h2><input id="filter" placeholder="搜尋班別，例如 1B02" oninput="renderStudents()"></div><div style="overflow:auto"><table><thead><tr><th>班別學號</th><th>挑戰</th><th>完成</th><th>最佳時間</th><th>平均時間</th><th>錯誤次數</th></tr></thead><tbody id="studentRows"></tbody></table></div></div><div class="card"><h2>題型統計</h2><div style="overflow:auto"><table><thead><tr><th>Lv</th><th>題型</th><th>事件次數</th><th>正確</th><th>準確率</th><th>平均完成時間</th></tr></thead><tbody id="questionRows"></tbody></table></div></div></div><script>const sb=supabase.createClient(SUPABASE_CONFIG.url,SUPABASE_CONFIG.anonKey);let students=[];async function loadAll(){try{const[o,s,q]=await Promise.all([sb.rpc('teacher_overview_public'),sb.rpc('teacher_student_performance_public'),sb.rpc('teacher_question_stats_public')]);if(o.error)throw o.error;if(s.error)throw s.error;if(q.error)throw q.error;const x=o.data?.[0]||{};students=s.data||[];document.getElementById('students').textContent=x.student_count??0;document.getElementById('games').textContent=x.total_games??0;document.getElementById('finished').textContent=x.finished_games??0;document.getElementById('avg').textContent=x.average_time==null?'—':Number(x.average_time).toFixed(1)+'s';renderStudents();document.getElementById('questionRows').innerHTML=(q.data||[]).map(r=>`<tr><td>${r.level}</td><td>${r.question_type||'—'}</td><td>${r.attempts}</td><td>${r.correct}</td><td>${r.accuracy??0}%</td><td>${r.avg_elapsed_ms==null?'—':(Math.round(r.avg_elapsed_ms/100)/10)+'s'}</td></tr>`).join('')||'<tr><td colspan="6">尚無資料</td></tr>'}catch(e){console.error(e);alert('載入失敗：'+e.message)}}function renderStudents(){const f=document.getElementById('filter').value.trim().toUpperCase();const rows=students.filter(x=>(x.class_seat||'').includes(f));document.getElementById('studentRows').innerHTML=rows.map(r=>`<tr><td><b>${r.class_seat}</b></td><td>${r.games_played}</td><td>${r.finished_games}</td><td>${r.best_time==null?'—':r.best_time+'s'}</td><td>${r.average_time==null?'—':r.average_time+'s'}</td><td>${r.total_incorrect}</td></tr>`).join('')||'<tr><td colspan="6">尚無資料</td></tr>'}loadAll();</script></body></html>
