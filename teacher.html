<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>方程移項大激鬥｜教師後台</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>body{font-family:system-ui,sans-serif;margin:0;background:#f5f7fb;color:#18212f}.wrap{max-width:1100px;margin:auto;padding:32px}.card{background:#fff;border-radius:16px;padding:20px;margin:16px 0;box-shadow:0 5px 22px #0001}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{font-size:28px;font-weight:700}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #eee;text-align:left}@media(max-width:800px){.grid{grid-template-columns:2fr 2fr}}</style></head><body><div class="wrap"><h1>教師後台</h1><p id="status">登入檢查中…</p><div id="app" hidden><div class="grid"><div class="card"><small>學生人數</small><div class="stat" id="students">-</div></div><div class="card"><small>總場次</small><div class="stat" id="games">-</div></div><div class="card"><small>完成場次</small><div class="stat" id="finished">-</div></div><div class="card"><small>平均時間</small><div class="stat" id="avg">-</div></div></div><div class="card"><h2>學生表現</h2><table><thead><tr><th>班別/座號</th><th>場次</th><th>完成</th><th>最佳</th><th>平均</th><th>錯誤</th></tr></thead><tbody id="studentsTable"></tbody></table></div><div class="card"><h2>題目統計</h2><table><thead><tr><th>級別</th><th>題號</th><th>作答</th><th>正確</th><th>準確率</th><th>平均耗時</th></tr></thead><tbody id="qTable"></tbody></table></div><button id="logout">登出</button></div></div><script>const cfg=window.SUPABASE_CONFIG||{};const sb=supabase.createClient(cfg.url,cfg.anonKey);const $=id=>document.getElementById(id),fmt=x=>x==null||x===''?'-':Number(x).toFixed(1);(async()=>{const {data:{session}}=await sb.auth.getSession();if(!session)return $('status').textContent='請先登入教師帳戶。';const {data:p}=await sb.from('profiles').select('role,class_seat,display_name').eq('id',session.user.id).single();if(p?.role!=='teacher')return $('status').textContent='此帳戶不是教師帳戶。';$('status').textContent='教師：'+(p.display_name||p.class_seat||session.user.email);$('app').hidden=false;const {data:o}=await sb.rpc('teacher_overview');const s=o?.[0]||{};$('students').textContent=s.total_students??0;$('games').textContent=s.total_games??0;$('finished').textContent=s.finished_games??0;$('avg').textContent=fmt(s.average_time)+' 秒';const {data:rows}=await sb.rpc('student_performance',{p_limit:500});$('studentsTable').innerHTML=(rows||[]).map(r=>`<tr><td>${r.class_seat||'-'}</td><td>${r.games_played}</td><td>${r.completed_games}</td><td>${fmt(r.best_time)}</td><td>${fmt(r.average_time)}</td><td>${r.total_incorrect}</td></tr>`).join('');const {data:qs}=await sb.rpc('question_stats');$('qTable').innerHTML=(qs||[]).map(r=>`<tr><td>Lv${r.level}</td><td>${r.question_no}</td><td>${r.attempts}</td><td>${r.correct_count}</td><td>${fmt(r.accuracy)}%</td><td>${r.average_elapsed_ms==null?'-':fmt(r.average_elapsed_ms/1000)+' 秒'}</td></tr>`).join('')})();$('logout').onclick=async()=>{await sb.auth.signOut();location.href='index.html'};</script></body></html>
