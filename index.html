<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>方程移項大激鬥（第一階段）</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>body{margin:0;background:#f3f4f7;color:#18202a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:980px;min-height:100vh;margin:auto;padding:24px;box-sizing:border-box}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 10px 30px #0001;margin:14px 0}.center{text-align:center}.title{font-size:clamp(28px,5vw,46px);font-weight:850;margin:8px 0}.muted{color:#737b87}.input{width:100%;box-sizing:border-box;border:2px solid #e3e6eb;background:#f8f9fb;border-radius:14px;padding:14px;font-size:20px;text-align:center;text-transform:uppercase}.levels{display:flex;gap:10px;margin:14px 0}.level{flex:1;border:2px solid #e2e5ea;background:#f6f7f9;border-radius:14px;padding:14px;font-weight:800;cursor:pointer}.level.on{border-color:#1677ff;background:#edf5ff;color:#1677ff}.btn{border:0;border-radius:14px;padding:14px 22px;font-size:18px;font-weight:800;background:#1677ff;color:#fff;cursor:pointer}.btn.secondary{background:#e9edf2;color:#18202a}.hidden{display:none}.hud{display:flex;gap:10px;align-items:center;justify-content:space-between}.pill{background:#f1f3f6;border-radius:12px;padding:9px 13px;font-weight:800}.stage{min-height:340px;border-radius:20px;background:#fbfaf7;border:2px solid #ece8df;display:flex;align-items:center;justify-content:center;position:relative;margin:18px 0}.eq{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;font-size:clamp(30px,7vw,58px);font-weight:850}.term{padding:12px 18px;border-radius:14px;background:#eef1f5;cursor:grab;user-select:none}.term.draggable{border:3px solid #1677ff}.target{position:absolute;left:50%;transform:translateX(-50%);bottom:20px;border:3px dashed #9aa3ad;border-radius:14px;padding:10px 24px;color:#7a838d;min-width:150px;text-align:center}.target.over{background:#e9f4ff;border-color:#1677ff}.choices{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}.choice{border:2px solid #dfe3e8;background:#fff;border-radius:13px;padding:12px 18px;font-size:18px;font-weight:800;cursor:pointer}.ok{color:#198754;font-weight:850}.bad{color:#d63345;font-weight:850}.rows{display:flex;flex-direction:column;gap:8px}.row{display:flex;justify-content:space-between;background:#f7f8fa;border-radius:10px;padding:9px 12px}.rank{font-size:42px;font-weight:900;color:#1677ff}.notice{background:#fff5d6;border-radius:12px;padding:10px;font-size:14px;color:#765400}@media(max-width:600px){.wrap{padding:12px}.card{padding:16px}.hud{font-size:14px}.stage{min-height:300px}.target{bottom:12px}}</style></head><body><main class="wrap"><section id="home" class="card center"><div class="muted">張沛松紀念中學</div><h1 class="title">方程移項大激鬥</h1><p class="muted">第一階段・10 題速度挑戰</p><div style="max-width:430px;margin:auto"><input id="seat" class="input" maxlength="10" placeholder="輸入班別學號，例如 1B02" autocomplete="off"><div class="levels"><button class="level on" data-lv="1">Lv1 基礎</button><button class="level" data-lv="2">Lv2 雙步</button><button class="level" data-lv="3">Lv3 交叉</button></div><button id="start" class="btn" style="width:100%">開始挑戰</button></div><div class="card" style="box-shadow:none;background:#f7f8fa;text-align:left"><b>🏆 排行榜</b><div id="leader" class="rows" style="margin-top:10px">載入中…</div></div><p class="muted" style="font-size:13px">學生不用註冊、不用登入，只需輸入班別學號。</p></section><section id="game" class="card hidden"><div class="hud"><button class="btn secondary" id="back">← 首頁</button><div class="pill" id="round">第 1 / 10 題</div><div class="pill" id="timer">0.0s</div></div><div style="height:7px;background:#e8ebef;border-radius:5px;margin:14px 0"><div id="bar" style="height:100%;width:0;background:#1677ff;border-radius:5px"></div></div><div id="instruction" class="center muted"></div><div id="stage" class="stage"><div id="equation" class="eq"></div><div id="target" class="target">把可移項的數字拖到這裡</div></div><div id="choices" class="choices"></div><div id="msg" class="center"></div></section><section id="end" class="card center hidden"><div class="rank">🎉 完成！</div><h2 id="finalSeat"></h2><div id="finalTime" style="font-size:54px;font-weight:900">0.0s</div><p id="finalInfo" class="muted"></p><button class="btn" id="again">再玩一次</button><div class="card" style="box-shadow:none;background:#f7f8fa;text-align:left"><b>🏆 本級排行榜</b><div id="endLeader" class="rows" style="margin-top:10px"></div></div></section><section class="center muted" style="font-size:12px;padding:10px"><a href="teacher.html">教師平台</a></section></main><script>const sb=supabase.createClient(SUPABASE_CONFIG.url,SUPABASE_CONFIG.anonKey);let level=1,seat='',gameId=null,round=0,startAt=0,penalty=0,wrong=0,timer=null,current=null;const total=10;const $=id=>document.getElementById(id);const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;function show(id){['home','game','end'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}document.querySelectorAll('.level').forEach(b=>b.onclick=()=>{document.querySelectorAll('.level').forEach(x=>x.classList.remove('on'));b.classList.add('on');level=+b.dataset.lv;loadBoard('leader')});async function loadBoard(id){try{const {data,error}=await sb.rpc('get_public_leaderboard',{p_level:level,p_limit:10});if(error)throw error;$(id).innerHTML=(data||[]).map(r=>`<div class="row"><span>#${r.rank_no} ${r.class_seat}</span><b>${Number(r.final_time).toFixed(1)}s</b></div>`).join('')||'<div class="muted">暫無紀錄</div>'}catch(e){$(id).innerHTML='<div class="muted">排行榜暫時無法載入</div>'}}function question(){if(level===1){let x=rnd(2,12),b=rnd(1,12),c=x+b;return{type:'L1',text:`x + ${b} = ${c}`,move:String(b),answer:x,step:'把 + 數字移到右邊後求 x'}}if(level===2){let a=rnd(2,9),x=rnd(2,10),b=rnd(1,9),c=a*x+b;return{type:'L2',text:`${a}x + ${b} = ${c}`,move:String(b),answer:x,step:'先移項，再除以係數'}}let a=rnd(2,6),d=rnd(1,a-1),x=rnd(2,8),b=rnd(1,8),e=d*x+b;return{type:'L3',text:`${a}x + ${b} = ${d}x + ${e}`,move:`${d}x`,answer:x,step:'先把 x 項移到左邊，再把常數移項'}}function render(){current=question();$('round').textContent=`第 ${round} / ${total} 題 (Lv${level})`;$('bar').style.width=((round-1)/total*100)+'%';$('instruction').textContent=current.step;$('msg').textContent='';$('choices').innerHTML='';const parts=current.text.split(' ');$('equation').innerHTML=parts.map(p=>p==='='?'<span>=</span>':(p===current.move?`<span class="term draggable" draggable="true" data-v="${p}">${p}</span>`:`<span>${p}</span>`)).join(' ');$('target').style.display='block';$('target').textContent='把可移項的項目拖到這裡';$('target').style.borderColor='';const t=document.querySelector('.draggable');if(t){t.ondragstart=e=>e.dataTransfer.setData('text/plain',t.dataset.v);$('target').ondragover=e=>{e.preventDefault();$('target').classList.add('over')};$('target').ondragleave=()=>$('target').classList.remove('over');$('target').ondrop=e=>{e.preventDefault();$('target').classList.remove('over');if(e.dataTransfer.getData('text/plain')===current.move){successStep()}else{wrong++;penalty+=2;fail()}}}let vals=level===1?[current.answer-2,current.answer,current.answer+2]:level===2?[current.answer-1,current.answer,current.answer+1]:[current.answer-2,current.answer,current.answer+2];$('choices').innerHTML='<span class="muted">完成移項後選擇 x =</span>'+[...new Set(vals)].map(v=>`<button class="choice" data-a="${v}">${v}</button>`).join('');document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(current&&+b.dataset.a===current.answer&&document.querySelector('.draggable')?.style.opacity==='0.5'){finishQuestion()}else{wrong++;penalty+=2;fail()}})}function fail(){$('msg').textContent='再試一次！錯誤 +2 秒';$('msg').className='center bad';$('stage').animate([{transform:'translateX(-7px)'},{transform:'translateX(7px)'},{transform:'translateX(0)'}],{duration:260});logAnswer('error',false,'wrong')}function successStep(){$('msg').textContent='移項成功！現在選擇答案';$('msg').className='center ok';$('target').textContent='✓ 移項成功';$('target').style.borderColor='#198754';document.querySelectorAll('.draggable').forEach(x=>x.style.opacity='.5');logAnswer('transposition',true,current.move)}function finishQuestion(){logAnswer('answer',true,current.answer);$('msg').textContent='✓ 正確！';$('msg').className='center ok';setTimeout(()=>{if(round>=total)endGame();else{round++;render()}},300)}async function logAnswer(eventType,correct,ans){if(!gameId)return;try{await sb.rpc('record_public_answer',{p_game_id:gameId,p_class_seat:seat,p_level:level,p_question_no:round,p_question_type:current.type,p_question:current,p_answer:String(ans),p_correct:correct,p_event_type:eventType,p_elapsed_ms:Date.now()-startAt,p_incorrect_attempts:wrong,p_penalty_time:penalty})}catch(e){console.warn(e)}}async function start(){seat=$('seat').value.trim().toUpperCase();if(!/^[0-9]+[A-Z]+[0-9]{1,3}$/.test(seat)){alert('請輸入有效班別學號，例如 1B02');return}try{const {data,error}=await sb.rpc('start_public_game',{p_class_seat:seat,p_level:level});if(error)throw error;gameId=data;round=1;wrong=0;penalty=0;startAt=Date.now();show('game');clearInterval(timer);timer=setInterval(()=>{$('timer').textContent=((Date.now()-startAt)/1000+penalty).toFixed(1)+'s'},100);render()}catch(e){alert('無法開始遊戲：'+e.message)}}async function endGame(){clearInterval(timer);const final=(Date.now()-startAt)/1000+penalty;let rank=0;try{const {data,error}=await sb.rpc('finish_public_game',{p_game_id:gameId,p_class_seat:seat,p_final_time:Number(final.toFixed(1)),p_incorrect_attempts:wrong,p_penalty_time:penalty});if(error)throw error;rank=data||0}catch(e){console.warn(e)}$('finalSeat').textContent=seat;$('finalTime').textContent=final.toFixed(1)+'s';$('finalInfo').textContent=`錯誤 ${wrong} 次・加時 ${penalty}s${rank?`・目前排名 #${rank}`:''}`;show('end');loadBoard('endLeader');gameId=null}function reset(){clearInterval(timer);show('home');loadBoard('leader')}$('start').onclick=start;$('back').onclick=reset;$('again').onclick=()=>{$('seat').value=seat;show('home');loadBoard('leader')};loadBoard('leader');</script></body></html>
