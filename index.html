<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"><title>方程移項大激鬥(第一階段) - Equation Transposition Battle</title><style>body{margin:0;background:#f2f2f7;color:#1c1c1e;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#game-container{width:96vw;height:94vh;max-width:1024px;max-height:768px;margin:3vh auto;background:#fff;border-radius:24px;box-shadow:0 15px 35px #0001;padding:24px;box-sizing:border-box;position:relative;overflow:hidden}.screen{display:none;flex-direction:column;width:100%;height:100%}.screen.active{display:flex}#welcome-screen{justify-content:space-around;align-items:center;overflow-y:auto}.apple-title{text-align:center;font-size:clamp(1.8rem,4vw,2.5rem);font-weight:800;margin:5px}.input-group{display:flex;flex-direction:column;gap:6px;width:90%;max-width:400px}.input-group label{font-size:.9rem;color:#8e8e93;font-weight:600}.apple-input{background:#f2f2f7;border:1px solid #e5e5ea;padding:12px 18px;border-radius:12px;font-size:1rem;text-align:center}.level-selector{display:flex;gap:10px;width:90%;max-width:400px}.level-btn{flex:1;background:#f2f2f7;border:2px solid transparent;padding:12px;border-radius:12px;font-weight:bold}.level-btn.selected{background:#fff;border-color:#07f;color:#07f}.apple-btn{background:#07f;color:white;border:0;padding:14px 30px;font-size:1.1rem;font-weight:600;border-radius:16px;cursor:pointer;width:90%;max-width:400px}.leaderboard-box{width:90%;max-width:400px;background:#f2f2f7;border-radius:18px;padding:14px 18px}.leaderboard-title{text-align:center;font-weight:700;margin-bottom:10px}.leaderboard-list{display:flex;flex-direction:column;gap:8px}.leaderboard-item{display:flex;justify-content:space-between;padding:8px 12px;background:#fff;border-radius:8px}.leaderboard-item.top{color:#07f;font-weight:700}#hud{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}.hud-pill{background:#f2f2f7;padding:8px 14px;border-radius:12px;font-weight:600}.back-home-btn{background:#e5e5ea;border:0;color:#1c1c1e;padding:8px 14px;border-radius:12px;font-weight:600}.round-indicator{flex-grow:1;text-align:center}#timer{color:#07f;font-family:monospace}#progress-container{width:100%;height:6px;background:#e5e5ea;border-radius:3px;margin-bottom:15px;overflow:hidden}#progress-bar{height:100%;width:0;background:#07f;transition:width .3s}.instruction{text-align:center;font-size:1.2rem;color:#8e8e93;font-weight:600;margin-bottom:12px;min-height:35px}.stage-area{flex-grow:1;display:flex;align-items:center;justify-content:center;position:relative;background:#faf9f6;border-radius:20px;border:1px solid #e5e5ea;margin-bottom:15px;overflow:hidden}.workspace{display:flex;align-items:center;justify-content:center;font-size:clamp(2rem,6vw,3.5rem);font-weight:700;gap:clamp(8px,2.5vw,15px);position:relative}.math-node{padding:8px 14px;background:#f2f2f7;border-radius:12px;min-width:40px;text-align:center}.math-node.equal{background:none}.math-node.draggable{cursor:grab;box-shadow:0 4px 10px #0001;border:2px solid #07f}.math-node.draggable span{pointer-events:none}.math-frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle}.math-frac-line{width:100%;min-width:45px;border-top:3px solid #1c1c1e}.clickable-calc{background:#e8f2ff;border:2px dashed #07f;border-radius:12px;padding:8px 14px;cursor:pointer}.drop-zone{position:absolute;min-width:90px;min-height:65px;border:3px dashed #8e8e93;border-radius:15px;display:flex;align-items:center;justify-content:center;color:#8e8e93;opacity:0;pointer-events:none;z-index:5}.drop-zone.visible{opacity:1}.drop-zone.active{border-color:#07f;background:#07f0d}.rank-card{background:#f2f2f7;padding:30px;border-radius:22px;text-align:center;width:90%;max-width:420px;margin:auto}.credits-footer{position:absolute;bottom:12px;right:24px;font-size:.7rem;color:#8e8e93}#toast{position:absolute;top:20px;left:50%;transform:translateX(-50%);background:#1c1c1edd;color:#fff;padding:10px 20px;border-radius:20px;opacity:0;pointer-events:none;transition:.3s;z-index:1000}.shake-red{animation:shake .4s;border:1.5px solid #ff3b30!important}@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}@media(max-width:600px){#game-container{width:100vw;height:100vh;margin:0;border-radius:0;padding:14px}.workspace{font-size:2rem}.math-node{padding:6px 9px}}</style></head><body><div id="game-container"><div id="toast">💡 請拖曳數字至虛線目標區</div><div id="welcome-screen" class="screen active"><div><div style="text-align:center;color:#07f;font-weight:700;letter-spacing:1.5px">張沛松紀念中學</div><h1 class="apple-title">方程移項大激鬥(第一階段)</h1><p style="color:#8e8e93;text-align:center">Proportion & Transposition Speedrun</p></div><div class="input-group"><label for="player-class-seat">班別及座號 (例如: 1B02)</label><input type="text" id="player-class-seat" class="apple-input" placeholder="例如: 1B02" maxlength="10"></div><div class="input-group" id="auth-fields"><label>學生登入／註冊</label><input type="email" id="auth-email" class="apple-input" placeholder="電郵地址" autocomplete="email"><input type="password" id="auth-password" class="apple-input" placeholder="密碼" autocomplete="current-password"><div style="display:flex;gap:10px"><button class="apple-btn" style="padding:12px;flex:1" onclick="loginStudent()">登入</button><button class="apple-btn" style="padding:12px;flex:1;background:#34c759" onclick="signupStudent()">註冊</button></div><div id="auth-status" style="text-align:center;color:#8e8e93;font-size:.85rem"></div></div><button id="logout-btn" class="back-home-btn" style="display:none" onclick="logoutStudent()">登出</button><div style="width:90%;max-width:400px"><label style="display:block;color:#8e8e93;font-weight:600;margin-bottom:6px">選擇難度等級</label><div class="level-selector"><button id="lvl1-btn" class="level-btn selected" onclick="selectLevel(1)">Lv1 基礎</button><button id="lvl2-btn" class="level-btn" onclick="selectLevel(2)">Lv2 雙步</button><button id="lvl3-btn" class="level-btn" onclick="selectLevel(3)">Lv3 交叉</button></div></div><button class="apple-btn" onclick="tryStartGame()">開始挑戰</button><div class="leaderboard-box"><div id="leaderboard-title" class="leaderboard-title">🏆 排行榜 (Lv1)</div><div id="leaderboard-container" class="leaderboard-list"></div></div></div><div id="play-screen" class="screen"><div id="hud"><button class="back-home-btn" onclick="resetToWelcome()">← 返回首頁</button><div id="round-indicator" class="hud-pill round-indicator">關卡: 1/10 (Lv1)</div><div id="timer" class="hud-pill">0.0s</div></div><div id="progress-container"><div id="progress-bar"></div></div><div id="instruction" class="instruction">第一步：移項</div><div id="stage-area" class="stage-area"><div id="target-zone" class="drop-zone">目標位置</div><div id="target-zone-2" class="drop-zone">目標位置</div><div id="workspace" class="workspace"></div></div></div><div id="end-screen" class="screen" style="justify-content:center;align-items:center;gap:20px"><h1 class="apple-title" style="color:#34c759">🎉 挑戰完成！</h1><div class="rank-card"><h2 id="final-player">[1B02]</h2><p id="final-penalty-display"></p><div id="final-time" style="font-size:3rem;font-weight:800;color:#07f">0.0s</div><div id="final-rank" style="font-size:1.2rem;font-weight:700"></div></div><button class="apple-btn" onclick="resetToWelcome()">返回首頁</button></div><div class="credits-footer">Equation Transposition Speedrun</div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const supabaseClient=window.supabase.createClient(window.SUPABASE_CONFIG.url,window.SUPABASE_CONFIG.anonKey);let authSession=null,currentGameId=null;const state={playerClassSeat:'',playerName:'',selectedLevel:1,startTime:null,penaltyTime:0,timerInt:null,currentRound:1,incorrectAttempts:0,gameState:'IDLE',currentQ:{},dragData:{active:false,el:null,startX:0,startY:0,x:0,y:0}};const totalRounds=10;
window.onload=async()=>{await initAuth();updateLeaderboardView()};
async function initAuth(){const {data}=await supabaseClient.auth.getSession();authSession=data.session;updateAuthUI();supabaseClient.auth.onAuthStateChange((_e,s)=>{authSession=s;updateAuthUI()})}
function updateAuthUI(){const f=document.getElementById('auth-fields'),l=document.getElementById('logout-btn'),st=document.getElementById('auth-status');if(authSession){f.style.display='none';l.style.display='block';st.textContent='已登入：'+authSession.user.email;supabaseClient.from('profiles').select('class_seat,display_name').eq('id',authSession.user.id).single().then(r=>{if(r.data?.class_seat)document.getElementById('player-class-seat').value=r.data.class_seat})}else{f.style.display='flex';l.style.display='none'}}
async function loginStudent(){const email=document.getElementById('auth-email').value.trim(),password=document.getElementById('auth-password').value,st=document.getElementById('auth-status');const {error}=await supabaseClient.auth.signInWithPassword({email,password});st.textContent=error?'登入失敗：'+error.message:'登入成功！'}
async function signupStudent(){const email=document.getElementById('auth-email').value.trim(),password=document.getElementById('auth-password').value,seat=document.getElementById('player-class-seat').value.trim().toUpperCase(),st=document.getElementById('auth-status');if(!seat)return st.textContent='請先填寫班別及座號。';const {error}=await supabaseClient.auth.signUp({email,password,options:{data:{class_seat:seat,display_name:seat}}});st.textContent=error?'註冊失敗：'+error.message:'註冊成功！如要求確認電郵，請先完成確認再登入。'}
async function logoutStudent(){await supabaseClient.auth.signOut();resetToWelcome()}
function selectLevel(lv){state.selectedLevel=lv;document.querySelectorAll('.level-btn').forEach(b=>b.classList.remove('selected'));document.getElementById('lvl'+lv+'-btn').classList.add('selected');updateLeaderboardView()}
function renderLeaderboardHTML(list){const c=document.getElementById('leaderboard-container');c.innerHTML='';if(!list.length){c.innerHTML='<div style="text-align:center;color:#8e8e93;padding:10px">尚無挑戰紀錄，快來搶佔第一！</div>';return}list.slice(0,10).forEach((x,i)=>c.innerHTML+=`<div class="leaderboard-item ${i===0?'top':''}"><span>NO.${i+1} [${x.classSeat}]</span><span>${Number(x.time).toFixed(1)} 秒</span></div>`)}
async function updateLeaderboardView(){const c=document.getElementById('leaderboard-container');if(!c)return;c.innerHTML='<div style="text-align:center;color:#8e8e93;padding:10px">雲端排行榜同步中...</div>';try{const {data,error}=await supabaseClient.rpc('get_leaderboard',{p_level:state.selectedLevel,p_limit:10});if(error)throw error;renderLeaderboardHTML((data||[]).map(x=>({classSeat:x.class_seat,time:x.final_time})))}catch(e){console.error(e);c.innerHTML='<div style="text-align:center;color:#ff3b30;padding:10px">雲端排行榜暫時無法載入</div>'}}
async function createCloudGame(){const {data,error}=await supabaseClient.from('games').insert({user_id:authSession.user.id,class_seat:state.playerClassSeat,level:state.selectedLevel,status:'playing'}).select('id').single();if(error)throw error;currentGameId=data.id}
async function logAnswerEvent(eventType,correct,answerValue){if(!currentGameId||!authSession)return;const q=state.currentQ||{};const {error}=await supabaseClient.from('answers').insert({game_id:currentGameId,user_id:authSession.user.id,class_seat:state.playerClassSeat,level:state.selectedLevel,question_no:state.currentRound,question_type:q.type||'',question:q,answer:String(answerValue??''),correct:!!correct,event_type:eventType,elapsed_ms:Date.now()-state.startTime,incorrect_attempts:state.incorrectAttempts,penalty_time:state.penaltyTime});if(error)console.error(error)}
async function finishCloudGame(t){if(!currentGameId||!authSession)return;const {data:rows}=await supabaseClient.rpc('get_leaderboard',{p_level:state.selectedLevel,p_limit:100});const rank=1+(rows||[]).filter(r=>Number(r.final_time)<Number(t.toFixed(1))).length;const {error}=await supabaseClient.from('games').update({finished_at:new Date().toISOString(),final_time:Number(t.toFixed(1)),incorrect_attempts:state.incorrectAttempts,penalty_time:state.penaltyTime,rank,status:'finished'}).eq('id',currentGameId).eq('user_id',authSession.user.id);if(error)throw error}
async function tryStartGame(){if(!authSession){showToast('請先登入學生帳戶！');return}const input=document.getElementById('player-class-seat');if(!input.value.trim()){showToast('請填寫【班別及座號】！');return}state.playerClassSeat=input.value.trim().toUpperCase();try{await createCloudGame();startGame()}catch(e){console.error(e);showToast('無法建立雲端挑戰，請稍後再試。')}}
function showToast(text){const t=document.getElementById('toast');t.innerText=text;t.style.opacity='1';t.style.top='30px';setTimeout(()=>{t.style.opacity='0';t.style.top='20px'},2200)}
function startGame(){state.currentRound=1;state.incorrectAttempts=0;state.penaltyTime=0;state.startTime=Date.now();document.getElementById('welcome-screen').classList.remove('active');document.getElementById('play-screen').classList.add('active');clearInterval(state.timerInt);state.timerInt=setInterval(updateTimer,100);loadRound()}
function updateTimer(){const e=(Date.now()-state.startTime)/1000+state.penaltyTime;document.getElementById('timer').innerText=e.toFixed(1)+'s'}
function loadRound(){const r=state.currentRound,lv=state.selectedLevel;document.getElementById('round-indicator').innerText=`關卡: ${r}/10 (Lv${lv})`;document.getElementById('progress-bar').style.width=`${((r-1)/totalRounds)*100}%`;if(lv===1)state.gameState='L1_CONST';if(lv===2)state.gameState='L2_CONST';generateQuestion()}
function generateQuestion(){const lv=state.selectedLevel;if(lv===1){const types=['add','sub','mul','div','add_x_second','sub_x_second','const_sub_x','neg_const_sub_x'],chosenType=types[Math.floor(Math.random()*types.length)],k=Math.floor(Math.random()*8)+2,ans=Math.floor(Math.random()*8)+2;if(chosenType==='add')state.currentQ={type:'add',k,c:ans+k,ans};else if(chosenType==='sub')state.currentQ={type:'sub',k,c:ans-k,ans};else if(chosenType==='mul')state.currentQ={type:'mul',k,c:k*ans,ans};else if(chosenType==='div')state.currentQ={type:'div',k,c:ans,ans:ans*k};else if(chosenType==='add_x_second')state.currentQ={type:'add_x_second',k,c:ans+k,ans};else if(chosenType==='sub_x_second')state.currentQ={type:'sub_x_second',k,c:-k+ans,ans};else if(chosenType==='const_sub_x'){const largeK=Math.floor(Math.random()*10)+11,b=largeK-ans;state.currentQ={type:'const_sub_x',k:largeK,c:b,ans}}else state.currentQ={type:'neg_const_sub_x',k,c:-k-ans,ans}}else if(lv===2){const types=['ax_add_k','ax_sub_k','x_frac_add','add_x_frac','sub_x_frac','neg_const_sub_x_frac'],chosenType=types[Math.floor(Math.random()*types.length)],a=Math.floor(Math.random()*4)+2,ans=Math.floor(Math.random()*8)+2,k=Math.floor(Math.random()*10)+1;if(chosenType==='ax_add_k'){const c=a*ans+k;state.currentQ={type:'ax_add_k',a,k,op:'+',c,ans}}else if(chosenType==='ax_sub_k'){const c=a*ans-k;state.currentQ={type:'ax_sub_k',a,k,op:'-',c,ans}}else if(chosenType==='x_frac_add'){const c=ans+k;state.currentQ={type:'x_frac_add',a,k,c,ans:ans*a}}else if(chosenType==='add_x_frac'){const c=k+ans;state.currentQ={type:'add_x_frac',a,k,c,ans:ans*a}}else if(chosenType==='sub_x_frac'){const c=-k+ans;state.currentQ={type:'sub_x_frac',a,k,c,ans:ans*a}}else{const c=ans-k;state.currentQ={type:'neg_const_sub_x_frac',a,k,c,ans:-ans*a}}}else{const isXBot=Math.random()>.5;if(isXBot){let b,d,a,ans;do{b=Math.floor(Math.random()*7)+2;d=Math.floor(Math.random()*7)+2;ans=Math.floor(Math.random()*8)+2;a=b*d/ans}while(!Number.isInteger(a)||a<=0||b===d);state.currentQ={b,d,a,ans,type:'x_bot'};state.gameState='L3_BOT_MOVE_D'}else{let b,d,a,ans;do{b=Math.floor(Math.random()*7)+2;d=Math.floor(Math.random()*7)+2;ans=Math.floor(Math.random()*8)+2;a=ans*d/b}while(!Number.isInteger(a)||a<=0||b===d);state.currentQ={b,d,a,ans,type:'normal'};state.gameState='L3_MOVE'}}renderEquation();setupDropZone();bindDragEvents()}
function renderEquation(){const q=state.currentQ,w=document.getElementById('workspace'),tz=document.getElementById('target-zone'),tz2=document.getElementById('target-zone-2'),ins=document.getElementById('instruction');tz.classList.remove('visible');tz2.classList.remove('visible');const modeText='';if(state.gameState==='L1_CONST'){ins.innerText='第一步：移項';w.innerHTML=`<div class="math-node draggable" id="drag-node"><span>${q.k}</span></div><div class="math-node equal">=</div><div class="math-node" id="right-val">${q.c}</div>`}else if(state.gameState==='L2_CONST'){ins.innerText='第一步：移項';w.innerHTML=`<div class="math-node draggable" id="drag-node"><span>${q.k}</span></div><div class="math-node equal">=</div><div class="math-node" id="right-val">${q.c}</div>`}else if(state.gameState==='L3_MOVE'){ins.innerText='第一步：將左側分母拖到右側分子旁邊進行相乘';w.innerHTML=`<div class="math-frac"><div class="math-node">x</div><div class="math-frac-line"></div><div class="math-node draggable" id="drag-node"><span>${q.b}</span></div></div><div class="math-node equal">=</div><div class="math-frac"><div class="math-node" id="target-ref">${q.a}</div><div class="math-frac-line"></div><div class="math-node">${q.d}</div></div>`}else if(state.gameState==='L3_BOT_MOVE_D'){ins.innerText='第一步：將右側分母拖到左側分子旁邊';w.innerHTML=`<div class="math-frac"><div class="math-node">x</div><div class="math-frac-line"></div><div class="math-node">${q.b}</div></div><div class="math-node equal">=</div><div class="math-frac"><div class="math-node">${q.a}</div><div class="math-frac-line"></div><div class="math-node draggable" id="drag-node"><span>${q.d}</span></div></div>`}else if(state.gameState==='L3_CALC_MUL'){ins.innerText='第二步：移項成功！點擊分子運算塊完成乘法計算';w.innerHTML=`<div class="math-node">x</div><div class="math-node equal">=</div><div class="math-frac"><div class="clickable-calc" onclick="resolveL3Mul()">${q.a} × ${q.b}</div><div class="math-frac-line"></div><div class="math-node">${q.d}</div></div>`}else if(state.gameState==='L3_CALC_FINAL'){ins.innerText='最後一步：點擊分數進行約分與除法計算';w.innerHTML=`<div class="math-node">x</div><div class="math-node equal">=</div><div class="math-frac clickable-calc" onclick="resolveL3Final()"><div class="math-node">${q.a*q.b}</div><div class="math-frac-line"></div><div class="math-node">${q.d}</div></div>`}else if(state.gameState==='L2_CALC_CONST'){ins.innerText='第二步：點擊運算塊進行數值計算';const op=q.op||'-';w.innerHTML=`<div class="math-node">${q.a||''}x</div><div class="math-node equal">=</div><div class="clickable-calc" onclick="resolveL2Const()">${q.c} ${op==='+'?'-':'+'} ${q.k}</div>`}else if(state.gameState==='L2_COEFF'){ins.innerText='第三步：將係數拖到右邊變成分母';w.innerHTML=`<div class="math-node draggable" id="drag-node"><span>${q.a}</span></div><div class="math-node">x</div><div class="math-node equal">=</div><div class="math-node" id="right-val">${q.midVal}</div>`}else if(state.gameState==='L2_CALC_FINAL'){ins.innerText='最後一步：點擊運算塊完成計算';w.innerHTML=`<div class="math-node">x</div><div class="math-node equal">=</div><div class="clickable-calc" onclick="resolveL2Final()">${q.midVal} × ${q.a}</div>`}else if(state.gameState==='L2_SIGN_CHANGE'){ins.innerText='最後一步：將負號拖到右側數字進行變號';w.innerHTML=`<div class="math-node draggable" id="drag-node"><span>-</span></div><div class="math-node">x</div><div class="math-node equal">=</div><div class="math-node" id="right-val">${q.midVal2}</div>`}else if(state.gameState==='L1_CALC'){ins.innerText='第二步：點擊運算塊計算';w.innerHTML=`<div class="math-node">x</div><div class="math-node equal">=</div><div class="clickable-calc" onclick="resolveL1()">計算</div>`}else{ins.innerText='請依指示完成移項';w.innerHTML=`<div class="math-node">x</div><div class="math-node equal">=</div><div class="math-node">${q.ans}</div>`}}
function setupDropZone(){setTimeout(updateDropZonePosition,0)}function updateDropZonePosition(){const d=document.getElementById('drag-node'),tz=document.getElementById('target-zone'),tz2=document.getElementById('target-zone-2');if(!d)return;const r=d.getBoundingClientRect(),stage=document.getElementById('stage-area').getBoundingClientRect();tz.style.left=(stage.width-(r.width+40))/2+'px';tz.style.top=(stage.height-(r.height+30))/2+'px';tz2.style.left=(stage.width/2+50)+'px';tz2.style.top=(stage.height/2-r.height/2)+'px'}
function bindDragEvents(){const d=document.getElementById('drag-node');if(!d)return;const start=e=>{const p=e.touches?e.touches[0]:e;state.dragData={active:true,el:d,startX:p.clientX,startY:p.clientY,x:p.clientX,y:p.clientY};d.style.zIndex=20;d.style.position='fixed';d.style.left=(p.clientX-d.offsetWidth/2)+'px';d.style.top=(p.clientY-d.offsetHeight/2)+'px';document.getElementById('target-zone').classList.add('visible');document.getElementById('target-zone-2').classList.add('visible');e.preventDefault()};const move=e=>{if(!state.dragData.active)return;const p=e.touches?e.touches[0]:e;d.style.left=(p.clientX-d.offsetWidth/2)+'px';d.style.top=(p.clientY-d.offsetHeight/2)+'px';state.dragData.x=p.clientX;state.dragData.y=p.clientY;e.preventDefault()};const end=e=>{if(!state.dragData.active)return;const p=e.changedTouches?e.changedTouches[0]:e;const zones=[document.getElementById('target-zone'),document.getElementById('target-zone-2')];const ok=zones.some(z=>{const r=z.getBoundingClientRect();return p.clientX>=r.left&&p.clientX<=r.right&&p.clientY>=r.top&&p.clientY<=r.bottom});state.dragData.active=false;d.style.position='';d.style.left='';d.style.top='';d.style.zIndex='';zones.forEach(z=>z.classList.remove('visible','active'));if(ok)handleSuccessTransposition();else triggerErrorAnimation();e.preventDefault()};d.addEventListener('mousedown',start);document.addEventListener('mousemove',move);document.addEventListener('mouseup',end);d.addEventListener('touchstart',start,{passive:false});document.addEventListener('touchmove',move,{passive:false});document.addEventListener('touchend',end,{passive:false})}
function triggerErrorAnimation(){state.incorrectAttempts++;state.penaltyTime+=2;logAnswerEvent('error',false,'drag-error').catch(console.error);const c=document.getElementById('game-container');c.classList.add('shake-red');showToast('⚠️ 移項位置不正確！請拖入目標落區內（罰時 +2秒）');setTimeout(()=>c.classList.remove('shake-red'),400)}
function handleSuccessTransposition(){const q=state.currentQ;if(state.gameState==='L1_CONST'){q.midVal=q.type==='add'?q.ans:q.type==='sub'?q.ans:q.type==='mul'?q.c/q.k:q.ans;state.gameState='L1_CALC'}else if(state.gameState==='L2_CONST'){q.midVal=q.op==='+'?q.c-q.k:q.c+q.k;state.gameState='L2_CALC_CONST'}else if(state.gameState==='L2_COEFF'){state.gameState='L2_CALC_FINAL'}else if(state.gameState==='L2_SIGN_CHANGE'){state.gameState='L2_CALC_FINAL'}else if(state.gameState==='L3_MOVE'||state.gameState==='L3_BOT_MOVE_D'){state.gameState='L3_CALC_MUL'}else{state.gameState='L1_CALC'}renderEquation();playSuccessEffect()}
function resolveL1(){state.gameState='L1_DONE';renderEquation();playSuccessEffect()}function resolveL1NegStep(){resolveL1()}function resolveL1NegFinal(){resolveL1()}function resolveL2Const(){state.gameState='L2_COEFF';state.currentQ.midVal=state.currentQ.ans*(state.currentQ.a||1);renderEquation()}function resolveL2Final(){state.gameState='L2_DONE';renderEquation();playSuccessEffect()}function resolveL2NegFinalStep(){resolveL2Final()}function resolveL2NegFinal(){resolveL2Final()}function resolveL3Mul(){state.gameState='L3_CALC_FINAL';renderEquation()}function resolveL3Final(){state.gameState='L3_DONE';renderEquation();playSuccessEffect()}function resolveL3BotD(){state.gameState='L3_CALC_MUL';renderEquation()}function resolveL3BotX(){resolveL3Final()}function resolveL3BotFinal(){resolveL3Final()}
function playSuccessEffect(){document.getElementById('instruction').innerText='正確！完美解答！';logAnswerEvent('answer',true,state.currentQ.ans).catch(console.error);setTimeout(()=>{if(state.currentRound<totalRounds){state.currentRound++;loadRound()}else endGame()},650)}
async function endGame(){clearInterval(state.timerInt);document.getElementById('play-screen').classList.remove('active');document.getElementById('end-screen').classList.add('active');const finalTimeElapsed=(Date.now()-state.startTime)/1000+state.penaltyTime,totalPenaltiesAdded=state.incorrectAttempts*2;document.getElementById('final-player').innerText=`[${state.playerClassSeat}]`;document.getElementById('final-penalty-display').innerText=`（包含移項出錯罰時：+${totalPenaltiesAdded} 秒，共出錯 ${state.incorrectAttempts} 次）`;document.getElementById('final-time').innerText=finalTimeElapsed.toFixed(1)+'s';let rank='';if(finalTimeElapsed<25)rank='👑 移項主宰 ( Monarch )';else if(finalTimeElapsed<45)rank='🥇 移項大師 ( Master )';else if(finalTimeElapsed<75)rank='🎓 移項精英 ( Elite )';else rank='🌱 移項新秀 ( Rookie )';document.getElementById('final-rank').innerText=rank;try{const ls=JSON.parse(localStorage.getItem('eq_run_local_scores_v5'))||{lv1:[],lv2:[],lv3:[]},k='lv'+state.selectedLevel;ls[k].push({classSeat:state.playerClassSeat,time:finalTimeElapsed});localStorage.setItem('eq_run_local_scores_v5',JSON.stringify(ls))}catch(e){}try{showToast('🚀 正在上傳成績至 Supabase...');await finishCloudGame(finalTimeElapsed);showToast('🚀 成績已成功同步至雲端排行榜！')}catch(e){console.error(e);showToast('❌ 雲端同步失敗，但本次遊戲仍已完成')}currentGameId=null}
function resetToWelcome(){clearInterval(state.timerInt);currentGameId=null;document.getElementById('play-screen').classList.remove('active');document.getElementById('end-screen').classList.remove('active');document.getElementById('welcome-screen').classList.add('active');updateLeaderboardView()}
window.selectLevel=selectLevel;window.tryStartGame=tryStartGame;window.resetToWelcome=resetToWelcome;window.resolveL1=resolveL1;window.resolveL1NegStep=resolveL1NegStep;window.resolveL1NegFinal=resolveL1NegFinal;window.resolveL2Const=resolveL2Const;window.resolveL2Final=resolveL2Final;window.resolveL2NegFinalStep=resolveL2NegFinalStep;window.resolveL2NegFinal=resolveL2NegFinal;window.resolveL3Mul=resolveL3Mul;window.resolveL3Final=resolveL3Final;window.resolveL3BotD=resolveL3BotD;window.resolveL3BotX=resolveL3BotX;window.resolveL3BotFinal=resolveL3BotFinal;window.loginStudent=loginStudent;window.signupStudent=signupStudent;window.logoutStudent=logoutStudent;window.triggerErrorAnimation=triggerErrorAnimation;window.showToast=showToast;
</script></body></html>
