<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>方程移項大激鬥</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#f2f2f7;color:#1c1c1e}.wrap{max-width:900px;margin:auto;padding:32px}.card{background:white;border-radius:20px;padding:24px;margin:16px 0;box-shadow:0 8px 30px #0001}button{border:0;border-radius:12px;padding:12px 18px;background:#07f;color:white;font-weight:700;cursor:pointer}.levels{display:flex;gap:8px}.levels button{flex:1;background:#eee;color:#111}.levels button.active{background:#07f;color:#fff}input{display:block;width:100%;box-sizing:border-box;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:10px}#game{display:none}.eq{font-size:42px;text-align:center;font-weight:800;margin:40px 0}.choices{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.choices button{background:#fff;color:#07f;border:2px solid #07f;font-size:20px}.muted{color:#777}</style></head><body><div class="wrap"><div class="card" id="auth"><h1>方程移項大激鬥</h1><p class="muted">學生登入後開始挑戰</p><input id="email" type="email" placeholder="電郵"><input id="password" type="password" placeholder="密碼"><input id="seat" placeholder="班別／座號（註冊時填）"><button onclick="login()">登入</button> <button onclick="signup()">註冊</button><p id="msg"></p></div><div class="card" id="home" style="display:none"><h1>選擇級別</h1><div class="levels"><button onclick="start(1)">Lv1</button><button onclick="start(2)">Lv2</button><button onclick="start(3)">Lv3</button></div><p id="user"></p><button onclick="logout()">登出</button></div><div class="card" id="game"><div><b id="round"></b>　<span id="timer">0.0s</span></div><div class="eq" id="eq"></div><p id="hint" style="text-align:center"></p><div class="choices" id="choices"></div></div><div class="card" id="result" style="display:none"><h2>完成！</h2><p id="resultText"></p><button onclick="location.reload()">返回</button></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const sb=supabase.createClient(SUPABASE_CONFIG.url,SUPABASE_CONFIG.anonKey);let session,user,level,round=0,score=0,wrong=0,startAt,current,answers=[];const qs={1:[['x + 7 = 15','8'],['x - 9 = 4','13'],['x + 12 = 20','8']],2:[['3x + 5 = 20','5'],['4x - 7 = 13','5'],['2x + 6 = 18','6']],3:[['2(x + 3) = 14','4'],['3(x - 2) = 15','7'],['4(x + 1) = 20','4']]};const $=x=>document.getElementById(x);async function init(){const r=await sb.auth.getSession();session=r.data.session;if(session){user=session.user;await showHome()}}init();async function login(){const r=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(r.error)return $('msg').textContent=r.error.message;session=r.data.session;user=session.user;showHome()}async function signup(){const r=await sb.auth.signUp({email:$('email').value,password:$('password').value,options:{data:{class_seat:$('seat').value,display_name:$('seat').value}}});$('msg').textContent=r.error?r.error.message:'註冊成功，請按要求確認電郵後登入。'}async function showHome(){const p=await sb.from('profiles').select('class_seat,display_name').eq('id',user.id).single();$('auth').style.display='none';$('home').style.display='block';$('user').textContent='登入：'+(p.data?.display_name||p.data?.class_seat||user.email)}async function logout(){await sb.auth.signOut();location.reload()}function start(l){level=l;round=0;score=0;wrong=0;answers=[];startAt=performance.now();$('home').style.display='none';$('game').style.display='block';next()}function next(){if(round>=10)return finish();round++;const arr=qs[level];current=arr[(round-1)%arr.length];$('round').textContent=`第 ${round}/10 題`;$('eq').textContent=current[0];$('hint').textContent='請選擇 x 的值';const correct=current[1];let vals=[correct,String(Number(correct)+1),String(Number(correct)-1),String(Number(correct)+2)].sort(()=>Math.random()-.5);$('choices').innerHTML=vals.map(v=>`<button onclick="answer('${v}')">x = ${v}</button>`).join('');}async function answer(v){const elapsed=Math.round(performance.now()-startAt);const correct=v===current[1];if(!correct){wrong++;$('hint').textContent='答錯：+2 秒，再試一次';return}score++;answers.push({question_no:round,question:current[0],answer:v,correct:true,elapsed_ms:elapsed});next()}async function finish(){const finalTime=(performance.now()-startAt)/1000+wrong*2;const p=await sb.from('profiles').select('class_seat').eq('id',user.id).single();const g=await sb.from('games').insert({user_id:user.id,class_seat:p.data?.class_seat||'',level,final_time:finalTime,incorrect_attempts:wrong,penalty_time:wrong*2,status:'finished',finished_at:new Date().toISOString()}).select('id').single();if(g.data?.id)await sb.from('answers').insert(answers.map(a=>({...a,game_id:g.data.id,user_id:user.id,class_seat:p.data?.class_seat||'',level,event_type:'answer',incorrect_attempts:wrong,penalty_time:wrong*2})));$('game').style.display='none';$('result').style.display='block';$('resultText').textContent=`Lv${level}｜時間 ${finalTime.toFixed(1)} 秒｜答錯 ${wrong} 次`}</script></body></html>
